<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo de Ping Pong Classic</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">
    <div class="score-board">
      <div class="score-box">
        <span class="player-label" id="p1-label">JOGADOR 1</span>
        <span class="score" id="score1">0</span>
      </div>
      <div class="vs">VS</div>
      <div class="score-box">
        <span class="player-label" id="p2-label">COMPUTADOR</span>
        <span class="score" id="score2">0</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="pongCanvas" width="800" height="500"></canvas>
      
      <!-- Overlay Menu / Pause / Game Over -->
      <div id="gameOverlay" class="overlay">
        <h1 id="overlayTitle">PING PONG</h1>
        <p id="overlaySubtitle">Escolha o modo de jogo para começar</p>
        
        <div class="menu-buttons">
          <button id="btn1Player" class="btn">1 Jogador (vs IA)</button>
          <button id="btn2Players" class="btn btn-secondary">2 Jogadores (Local)</button>
        </div>

        <div class="controls-hint">
          <p><strong>Controles:</strong></p>
          <p><strong>P1:</strong> Teclas <kbd>W</kbd> e <kbd>S</kbd> (ou arrastar na tela)</p>
          <p><strong>P2:</strong> Setas <kbd>↑</kbd> e <kbd>↓</kbd></p>
          <p><kbd>Espaço</kbd> ou <kbd>P</kbd> para Pausar</p>
        </div>
      </div>
    </div>

    <div class="bottom-controls">
      <button id="btnPause" class="btn-small">Pausar (P)</button>
      <button id="btnSound" class="btn-small">Som: LIGADO</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
